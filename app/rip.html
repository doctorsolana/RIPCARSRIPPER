<!doctype html>
<!-- The pack-rip reveal (the RIPCARS prototype): a dev-mode page now - the top bar links it in dev mode; old links to /
     with its knobs (?car=, ?mode=, ?t= ...) redirect here (index.html). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0b0c10" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png?v=2" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png?v=2" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />
    <title>RIPCARS Reveal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      /* the drive page hand-offs (a spin, or online), next to "Rip again" */
      .p-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      @media (min-aspect-ratio: 9/10) { .p-actions { justify-content: flex-start; } }
      #spin { margin-top: 12px; padding: 12px 22px; border-radius: 999px; text-decoration: none; cursor: pointer;
        font: 700 13px/1 Inter, system-ui, sans-serif; letter-spacing: 0.2em; text-transform: uppercase; color: #fff;
        background: color-mix(in srgb, var(--tier) 35%, transparent); border: 1px solid var(--tier); }
      #spin:hover { background: color-mix(in srgb, var(--tier) 55%, transparent); }
      #spin[hidden], #race[hidden] { display: none; }
      #race { margin-top: 12px; padding: 12px 22px; border-radius: 999px; text-decoration: none; cursor: pointer;
        font: 700 13px/1 Inter, system-ui, sans-serif; letter-spacing: 0.2em; text-transform: uppercase; color: #fff;
        background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.22); }
      #race:hover { background: rgba(255, 255, 255, 0.12); }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="flash"></div>
    <div id="tear"></div>
    <div id="steps"><i></i><i></i><i></i></div>
    <div id="stage-text">
      <div class="block" id="b-era"><div class="label">Model year</div><div class="value" id="year"></div></div>
      <div class="block" id="b-make">
        <div class="label">Make</div>
        <div class="value" id="make"></div>
        <div class="badge" id="badge"></div>
      </div>
      <div class="block" id="b-model"><div class="label">Model</div><div class="value" id="model"></div></div>
    </div>
    <div id="panel">
      <div class="chip" id="p-rarity"></div>
      <div class="p-name" id="p-name"></div>
      <div class="p-sub" id="p-sub"></div>
      <div class="p-sub2" id="p-sub2"></div>
      <div class="p-actions">
        <button id="replay">Rip again</button>
        <a id="spin" href="/drive.html">Take it for a spin</a>
        <a id="race" href="/online.html">Race it online</a>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
