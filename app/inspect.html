<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0b0c10" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>racecars · Inspect cars</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      :root { --bg: #0d0e12; --panel: #16171d; --panel2: #1d1f27; --text: #eef0f3; --muted: #8b90a0; --line: #2a2c35; --accent: #3dff8b; --ok: #3dff8b; --warn: #ffb020; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 Inter, system-ui, sans-serif; }
      #app { display: grid; grid-template-columns: 260px 1fr; height: 100%; padding-top: 48px; /* the top bar */ }
      @media (max-width: 760px) { #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } #list { max-height: 30vh; } }
      #list { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; }
      #list h1 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 16px; }
      .car { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit; padding: 10px 16px; border-left: 3px solid transparent; cursor: pointer; }
      .car:hover { background: var(--panel2); }
      .car.on { background: var(--panel2); border-left-color: var(--accent); }
      .car b { display: block; }
      .car small { color: var(--muted); display: flex; gap: 8px; align-items: center; }
      .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
      main { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
      #head { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
      #head h2 { font-size: 16px; margin: 0; margin-right: auto; }
      .tabs { display: flex; gap: 6px; }
      .tabs button, .tools button { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); cursor: pointer; font: inherit; }
      .tabs button.on, .tools button.on { border-color: var(--accent); background: #142a1d; }
      #body { position: relative; min-height: 0; }
      .pane { position: absolute; inset: 0; display: none; }
      .pane.on { display: block; }
      #p3d canvas { width: 100%; height: 100%; display: block; }
      .tools { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
      iframe { width: 100%; height: 100%; border: 0; background: #fff; }
      #pinfo { overflow-y: auto; padding: 16px; }
      #pinfo table { border-collapse: collapse; margin-bottom: 18px; min-width: 320px; }
      #pinfo td, #pinfo th { padding: 6px 12px; border-bottom: 1px solid var(--line); text-align: left; }
      #pinfo th { color: var(--muted); font-weight: 500; }
      #pinfo h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; }
      #pinfo li { margin: 4px 0; color: #cfd3dc; }
      .pass { color: var(--ok); } .fail { color: var(--warn); }
    </style>
  </head>
  <body>
    <div id="app">
      <nav id="list"><h1>Cars</h1></nav>
      <main>
        <div id="head">
          <h2 id="name">—</h2>
          <div class="tabs">
            <button data-tab="p3d" class="on">3D</button>
            <button data-tab="pcompare">Versions</button>
            <button data-tab="pviews">vs sheet</button>
            <button data-tab="preveal">Reveal</button>
            <button data-tab="pinfo">Report</button>
          </div>
        </div>
        <div id="body">
          <div class="pane on" id="p3d">
            <div class="tools">
              <button data-view="0.75,0.3">Front ¾</button>
              <button data-view="-0.9,0.3">Rear ¾</button>
              <button data-view="0,0.02">Side</button>
              <button data-view="1.5708,0.05">Front</button>
              <button data-view="-1.5708,0.05">Rear</button>
              <button data-view="0.0001,1.55">Top</button>
              <button id="t-clay">Clay</button>
              <button id="t-wire">Wireframe</button>
              <button id="t-spin" class="on">Spin</button>
            </div>
          </div>
          <div class="pane" id="pcompare"><iframe title="All versions"></iframe></div>
          <div class="pane" id="pviews"><iframe title="Sheet vs model"></iframe></div>
          <div class="pane" id="preveal"><iframe title="Reveal"></iframe></div>
          <div class="pane" id="pinfo"></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/inspect.ts"></script>
  </body>
</html>
