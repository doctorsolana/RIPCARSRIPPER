<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0e12" />
    <meta name="description" content="Race Hot Wheels Rip Cars online. Two tracks, a weekly leaderboard, your garage." />
    <link rel="icon" href="data:," />
    <title>RACECARS</title>
    <script>
      // old links to the pack-rip reveal (it was this page): / with its knobs goes to rip.html, the query kept
      if (/[?&](car|mode|t|card|az|el|yaw|unlit|reveal|rarity)=/.test(location.search)) location.replace('/rip.html' + location.search + location.hash);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/home/style.css" />
  </head>
  <body>
    <main id="home">
      <section class="hero" id="hero">
        <div class="wrap hero-in">
          <div class="hero-txt">
            <p class="eyebrow" id="h-eyebrow">Nissan · 1998</p>
            <h1 id="h-name">LB-ER34 Skyline</h1>
            <div class="hero-go">
              <a class="btn primary big" id="h-race" href="/online.html?car=skyline-hck01">Race online</a>
              <a class="btn big" id="h-drive" href="/drive.html?car=skyline-hck01">Drive</a>
            </div>
            <p class="live" id="h-live" hidden></p>
          </div>
          <div class="hero-car" id="h-car">
            <div class="hero-make" id="h-make" aria-hidden="true">Nissan</div>
            <img id="h-img" src="/src/home/img/car-skyline-hck01-1440.webp"
              srcset="/src/home/img/car-skyline-hck01-640.webp 640w, /src/home/img/car-skyline-hck01-1440.webp 1440w"
              sizes="(max-width: 760px) 100vw, 60vw" width="1440" height="900" alt="" fetchpriority="high" />
            <canvas id="h-3d" aria-label="The car in 3D: drag to turn it"></canvas>
          </div>
        </div>
      </section>
      <section class="sec wrap" id="week" aria-labelledby="week-h">
        <div class="sec-head"><h2 id="week-h">This week</h2><span class="aside" id="reset"></span></div>
        <div class="tracks" id="tracks"></div>
      </section>
      <section class="sec wrap" id="rooms" aria-labelledby="rooms-h">
        <div class="sec-head"><h2 id="rooms-h">Open rooms<small id="r-count"></small></h2>
          <div class="sec-act"><a class="more" href="/online.html" id="r-all">All rooms</a><button type="button" class="btn primary sm" id="r-create" disabled>Create room</button></div></div>
        <div id="r-list" aria-live="polite"></div>
      </section>
      <section class="sec wrap" id="garage" aria-labelledby="garage-h">
        <div class="sec-head"><h2 id="garage-h">Garage</h2><div class="sec-act" id="g-act"></div></div>
        <div id="g-body"></div>
      </section>
      <footer class="foot wrap" id="foot"></footer>
    </main>
    <script type="module" src="/src/home/main.ts"></script>
  </body>
</html>
