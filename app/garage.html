    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="/src/garage/style.css" />
  </head>
  <body>
    <main id="garage-page">
      <section class="g-top">
        <div class="g-stage" id="stage">
          <div class="g-make" id="make" aria-hidden="true"></div>
          <img class="g-still" id="still" alt="" />
          <canvas class="g-3d" id="c3d" aria-label="The car in 3D: drag to turn round it"></canvas>
          <figure class="g-photo" id="photo" hidden><img alt="" referrerpolicy="no-referrer" /></figure>
        </div>
        <aside class="g-info" id="info"></aside>
      </section>
      <section class="g-rail" aria-label="Cars">
        <div class="g-rail-head"><nav class="g-tabs" id="tabs" aria-label="Which cars"></nav><div class="g-act" id="act"></div></div>
        <div class="g-strip" id="strip" role="listbox" aria-label="Cars"></div>
      </section>
    </main>
    <script type="module" src="/src/garage/main.ts"></script>
  </body>
</html>
